.main-btn{

  overflow:hidden;

  transition:
    transform .25s ease,
    filter .25s ease,
    box-shadow .25s ease;
}

.main-btn::before{
  content:"";
  position:absolute;
  top:-85%;
  left:-60%;
  width:34%;
  height:270%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.14),
    rgba(255,255,255,.85),
    rgba(255,255,255,.20),

  );
  transform:rotate(24deg);
  filter:blur(1px);
  animation:btnLightning 2.2s ease-in-out infinite;
  pointer-events:none;
  z-index:2;
}

.main-btn::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:
    inset 0 0 12px rgba(255,255,255,.16),
    inset 0 0 26px rgba(255,255,255,.04);
  animation:btnInnerGlow 1.5s ease-in-out infinite alternate;
  pointer-events:none;
  z-index:1;
}

.main-btn:hover{
  transform:translateY(-2px) scale(1.015);
  filter:brightness(1.08);
}

/* =========================
   ANIMATIONS
========================= */
@keyframes btnLightning{
  0%{ left:-60%; opacity:0; }
  12%{ opacity:1; }
  58%{ opacity:1; }
  100%{ left:130%; opacity:0; }
}

@keyframes btnInnerGlow{
  from{ opacity:.50; }
  to{ opacity:1; }
}

@keyframes replayPulse{
  from{
    box-shadow:
      inset 0 -3px 0 rgba(90,0,0,.25),
      0 0 8px rgba(255,90,90,.25),
      0 0 16px rgba(255,30,30,.12);
  }
  to{

      0 0 13px rgba(255,120,120,.60),
      0 0 30px rgba(255,40,40,.30),
      0 0 46px rgba(255,40,40,.16);
  }
}

@keyframes goldPulse{
  from{
    box-shadow:
      inset 0 -3px 0 rgba(140,88,0,.28),
      0 0 8px rgba(255,210,0,.25),
      0 0 16px rgba(255,180,0,.12);

  to{

      0 0 13px rgba(255,235,120,.68),
      0 0 30px rgba(255,190,0,.34),
      0 0 46px rgba(255,150,0,.16);
  }
}

@keyframes greenPulse{
